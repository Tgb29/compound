# Medicines on the watchlist. Update `stage`, `latest`, `next`, `asof` and `source` together.
# area: obesity | longevity | ai-discovered | other

- id: retatrutide
  name: Retatrutide
  company: Eli Lilly
  ticker: LLY
  area: obesity
  what: Weekly injection. A "triple agonist" that acts on the GLP-1, GIP and glucagon receptors — curbing appetite and possibly raising the energy the body burns.
  stage: Phase 3 complete
  latest: "Jul 2026: the TRIUMPH-2 and TRIUMPH-3 trials met their goals, with about 21–23% weight loss at 80 weeks on the top doses versus 3–4% on placebo."
  next: Lilly plans to file with the FDA in Q1 2027 — later than first planned, because it needs more manufacturing data.
  asof: 2026-07-23
  source: https://www.hcplive.com/view/retatrutide-meets-phase-3-weight-loss-endpoints-in-2-obesity-trials

- id: orforglipron
  name: Orforglipron (Foundayo)
  company: Eli Lilly
  ticker: LLY
  area: obesity
  what: Daily pill. A small-molecule GLP-1 drug (not a protein), so it can be taken any time, with or without food.
  stage: Approved (US)
  latest: "Oct 2026: the EU medicines committee recommended approval for weight management and type 2 diabetes. The FDA approved it for obesity in Apr 2026."
  next: The European Commission's final decision, usually a few weeks after the committee's opinion. A US decision for type 2 diabetes is pending, with no public date.
  asof: 2026-10-16
  source: https://www.pharmexec.com/view/ema-panel-backs-lilly-foundayo-obesity-type-2-diabetes-europe

- id: wegovy-pill
  name: Wegovy pill (oral semaglutide 25 mg)
  company: Novo Nordisk
  ticker: NVO
  area: obesity
  what: Daily tablet of semaglutide, the same GLP-1 drug as in Wegovy shots.
  stage: Approved (US, EU)
  latest: "Jul 2026: the European Commission approved it. After its US launch in Jan 2026 it passed 3 million prescriptions by June."
  next: Launches in more countries in the second half of 2026.
  asof: 2026-07-15
  source: https://www.biospace.com/press-releases/novo-nordisk-receives-european-commission-approval-of-wegovy-pill-as-first-oral-glp-1-for-weight-management-in-the-eu-single-ready-to-use-pen-for-higher-dose-7-2-mg-also-approved

- id: cagrisema
  name: CagriSema
  company: Novo Nordisk
  ticker: NVO
  area: obesity
  what: Weekly injection combining semaglutide (GLP-1) with cagrilintide, a long-acting copy of the fullness hormone amylin.
  stage: Filed (US)
  latest: "Oct 2026: a post hoc look at the REDEFINE 1 trial found women lost about 25% of body weight on average at 68 weeks."
  next: Novo expects the FDA decision in Q4 2026. It filed in Dec 2025; no PDUFA date is public.
  asof: 2026-10-20
  source: https://www.prnewswire.com/news-releases/novos-cagrisema-was-associated-with-25-weight-loss-on-average-for-women-in-a-post-hoc-analysis-of-redefine-1-presented-at-the-menopause-society-annual-meeting-302914051.html

- id: amycretin
  name: Amycretin (zenagamtide)
  company: Novo Nordisk
  ticker: NVO
  area: obesity
  what: One molecule that switches on both the GLP-1 and amylin receptors, tested as a weekly shot and as a daily pill.
  stage: Phase 3
  latest: "2026: Novo started the large AMAZE Phase 3 program in Feb, adding trials through Sep. The drug's official name is now zenagamtide."
  next: A heart-outcomes trial of about 8,500 people is listed to start Oct 26, 2026. The first Phase 3 trials are listed to finish around mid-2028.
  asof: 2026-10-20
  source: https://clinicaltrials.gov/study/NCT07339423

- id: maritide
  name: MariTide (maridebart cafraglutide)
  company: Amgen
  ticker: AMGN
  area: obesity
  what: An antibody-peptide hybrid that switches on GLP-1 and blocks the GIP receptor, meant to be injected monthly or less often.
  stage: Phase 3
  latest: "Aug 2026: Amgen dropped its other early obesity drug, so MariTide is now its only weight-loss program."
  next: Analysts expect the first Phase 3 weight-loss results in the first half of 2027. Amgen reports Q3 results Nov 3, 2026.
  asof: 2026-10-08
  source: https://www.biospace.com/business/amgens-maritide-stands-alone-after-obesity-cull-while-analysts-seek-more-m-a

- id: survodutide
  name: Survodutide
  company: Boehringer Ingelheim / Zealand Pharma
  ticker: ZEAL
  area: obesity
  what: Weekly injection that switches on the glucagon and GLP-1 receptors, aimed at both weight and liver fat.
  stage: Phase 3
  latest: "Oct 2026: SYNCHRONIZE-2 (people with type 2 diabetes) met its goals, with up to 13.1% weight loss vs 3.1% on placebo at 76 weeks. About 18% of patients stopped because of stomach side effects."
  next: Results from the heart-safety trial are due later in 2026. No filing has been announced.
  asof: 2026-10-01
  source: https://www.taiwannews.com.tw/en/news/6450029

- id: vk2735
  name: VK2735
  company: Viking Therapeutics
  ticker: VKTX
  area: obesity
  what: Dual GLP-1 and GIP agonist — the same idea as Zepbound — developed as a weekly shot and a daily pill.
  stage: Phase 3
  latest: "Oct 2026: Viking started the SUNRISE Phase 3 trials of the pill. In Sep a study showed most weight loss was kept after switching to less frequent shots."
  next: The injectable VANQUISH Phase 3 trials are fully enrolled; the registry lists completion in Jul 2027.
  asof: 2026-10-14
  source: https://www.biopharminternational.com/view/viking-starts-phase-3-sunrise-program-for-oral-vk2735-in-obesity

- id: aleniglipron
  name: Aleniglipron
  company: Structure Therapeutics
  ticker: GPCR
  area: obesity
  what: Daily small-molecule GLP-1 pill, the same approach as Lilly's Foundayo.
  stage: Phase 3
  latest: "Sep 2026: the ACCOMPLISH Phase 3 program began in Aug. A 72-week extension study showed up to 16.2% weight loss with no plateau."
  next: Q4 2026 results from smaller studies; Phase 3 topline expected in the second half of 2028.
  asof: 2026-09-08
  source: https://www.sec.gov/Archives/edgar/data/0001888886/000110465926105688/tm2624945d1_ex99-1.htm

- id: loy-002
  name: LOY-002
  company: Loyal
  area: longevity
  what: Daily pill for senior dogs meant to extend healthy lifespan — the first drug to seek FDA sign-off for that claim.
  stage: FDA conditional review
  latest: "Jan 2026: the FDA accepted the safety section (it accepted effectiveness in Feb 2025). The 1,300-dog STAY study is still running."
  next: The manufacturing section, the last major piece, is now expected to be reviewed in 2027.
  asof: 2026-10-17
  source: https://yahoo.com/news/science/articles/could-daily-pill-help-dog-133053676.html

- id: bge-102
  name: BGE-102
  company: BioAge Labs
  ticker: BIOA
  area: longevity
  what: Daily pill that reaches the brain and blocks NLRP3, an immune "alarm" switch behind chronic age-related inflammation.
  stage: Phase 2
  latest: "Jun 2026: first patient dosed in QUELL-CV (about 160 adults with obesity and high inflammation). In Phase 1 it cut the inflammation marker hsCRP by about 86%."
  next: Topline results expected in the second half of 2026; eye-disease data in mid-2027.
  asof: 2026-08-05
  source: https://www.sec.gov/Archives/edgar/data/0001709941/000119312526335368/bioa-ex99_1.htm

- id: rentosertib
  name: Rentosertib (ISM001-055)
  company: Insilico Medicine
  ticker: 3696.HK
  area: ai-discovered
  what: Daily pill that blocks TNIK, an enzyme tied to tissue scarring. Insilico's AI picked both the target and the molecule. Tested in IPF, a lung-scarring disease.
  stage: Phase 3 (China)
  latest: "Sep 2026: first patient dosed in GENESIS-IPF-3, planned for about 320 patients at 47 sites in China."
  next: The trial measures lung-function decline over 52 weeks. No readout date given.
  asof: 2026-09-10
  source: https://insilico.com/news/isn1009261-insilico-medicine-doses-first-patient-genesis-ipf-3

- id: golukibart
  name: GB-0895 (golukibart)
  company: Generate Biomedicines
  ticker: GENB
  area: ai-discovered
  what: Long-acting antibody against TSLP, an early trigger of airway inflammation, designed with Generate's AI protein platform. Tested in severe asthma and COPD.
  stage: Phase 3
  latest: "Aug 2026: two Phase 3 severe-asthma trials are enrolling in six regions."
  next: No Phase 3 readout date disclosed.
  asof: 2026-08-06
  source: https://finviz.com/news/378386/generate-biomedicines-inc-reports-second-quarter-2026-financial-results-and-provides-business-update

- id: rec-4881
  name: REC-4881
  company: Recursion
  ticker: RXRX
  area: ai-discovered
  what: Pill that blocks MEK1/2, aimed at shrinking polyps in familial adenomatous polyposis (FAP), an inherited condition. Recursion found this use with its AI cell-imaging platform.
  stage: Phase 2
  latest: "Oct 2026: in the small TUPELO study, 87% of patients had less polyp burden at 12 weeks (median drop 47%)."
  next: More data at a GI meeting Nov 2, 2026. A registration trial is targeted for the second half of 2027.
  asof: 2026-10-15
  source: https://www.sec.gov/Archives/edgar/data/0001601830/000160183026000128/exhibit992-businessupdate.htm

- id: abs-201
  name: ABS-201
  company: Absci
  ticker: ABSI
  area: ai-discovered
  what: AI-designed antibody that blocks the prolactin receptor, tested for pattern hair loss and planned for endometriosis.
  stage: Phase 1/2a
  latest: "Sep 2026: Absci outlined a ~150-patient Phase 2 endometriosis trial, now planned for mid-2027. Lilly invested $40M in Aug."
  next: Interim hair-loss data were guided for the second half of 2026, full data early 2027. Q3 report Nov 12, 2026.
  asof: 2026-09-24
  source: https://finviz.com/news/395147/absci-announces-preliminary-details-for-phase-2-storyline-trial-of-ai-designed-antibody-abs-201-for-endometriosis
