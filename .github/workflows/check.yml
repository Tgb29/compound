name: Check brief

# Every daily-brief pull request must build: this catches a malformed brief
# (missing source link, unknown category, bad date) before it can be merged.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
